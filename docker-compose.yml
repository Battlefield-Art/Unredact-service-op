# UnredactServiceOp - Docker Compose Configuration
# Production-ready setup with web, worker, redis, beat, and webhook services

services:
  # Redis Cache & Message Broker
  redis:
    image: redis:7-alpine
    container_name: unredact_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  # Celery Worker - Handles heavy processing tasks
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: unredact_worker
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - LOG_LEVEL=INFO
      - MAX_WORKERS=4
      - TASK_SOFT_TIME_LIMIT=120
      - TASK_HARD_TIME_LIMIT=180
      - WORKER_MAX_MEMORY_PER_TASK=1572864000  # 1.5GB in bytes
      - CELERY_MAX_RETRIES=3
      - CELERY_RETRY_BACKOFF_MAX=600
      - REDIS_MAX_CONNECTIONS=50
    volumes:
      - ./temp:/app/temp
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A celery_app inspect ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '4.0'
      replicas: 2

  # Celery Beat - Scheduled cleanup tasks
  beat:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: unredact_beat
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - LOG_LEVEL=INFO
    command: celery -A celery_app beat --loglevel=info --schedule=/app/celerybeat-schedule.db
    volumes:
      - ./temp:/app/temp
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      worker:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery.*beat' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # Streamlit Web Application
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: unredact_web
    ports:
      - "8501:8501"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - LOG_LEVEL=INFO
      - MAX_CONTENT_SIZE=52428800  # 50MB
      - RATE_LIMIT_FILES=20
      - RATE_LIMIT_WINDOW=300  # 5 minutes
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY:-}
      - STRIPE_PRICE_ID_MONTHLY=${STRIPE_PRICE_ID_MONTHLY:-}
      - STRIPE_PRICE_ID_ANNUAL=${STRIPE_PRICE_ID_ANNUAL:-}
      - STRIPE_MODE=${STRIPE_MODE:-test}
      - FREE_TIER_SCANS_PER_DAY=5
      - FREE_TIER_WATERMARK_ENABLED=true
    volumes:
      - ./temp:/app/temp
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2.0'

  # Stripe Webhook Handler
  webhook:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: unredact_webhook
    ports:
      - "5000:5000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_PRICE_ID_MONTHLY=${STRIPE_PRICE_ID_MONTHLY:-}
      - STRIPE_PRICE_ID_ANNUAL=${STRIPE_PRICE_ID_ANNUAL:-}
      - LOG_LEVEL=INFO
    volumes:
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    command: gunicorn -w 4 -b 0.0.0.0:5000 stripe_webhook:app

volumes:
  redis_data:

networks:
  default:
    name: unredact_network
